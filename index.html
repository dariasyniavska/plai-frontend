<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Plai - Гірські Маршрути</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="nav"></nav>

    <div class="container">
        <h1>🌲 Маршрути Карпатами</h1>
        <ul id="routes-list"><li>Завантаження...</li></ul>
    </div>

    <script src="auth.js"></script>
    <script>
        const difficultyMap = {
            easy: "Легкий",
            medium: "Середній",
            hard: "Складний",
        };

        async function loadRoutes() {
            const list = document.getElementById("routes-list");
            try {
                const response = await apiFetch("/routes/");
                const data = await response.json();
                list.innerHTML = "";

                if (data.length === 0) {
                    list.innerHTML = "<li>Маршрутів поки немає.</li>";
                    return;
                }

                data.forEach((route) => {
                    const item = document.createElement("li");

                    const title = document.createElement("strong");
                    title.textContent = route.name;

                    const badge = document.createElement("span");
                    badge.className = "difficulty-badge";
                    badge.textContent = difficultyMap[route.difficulty] || route.difficulty;

                    const description = document.createElement("p");
                    description.textContent = route.description;

                    item.append(title, badge, description);
                    list.appendChild(item);
                });
            } catch (error) {
                console.error("Помилка:", error);
                list.innerHTML = "<li>Помилка завантаження даних з бекенду. Перевірте, чи запущений сервер Django.</li>";
            }
        }

        renderNav();
        loadRoutes();
    </script>
</body>
</html>
